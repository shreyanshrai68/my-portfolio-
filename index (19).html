<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Cyber Suite: Air Canvas, 3D Brain, Particles & Quantum Matrix</title>
  
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <!-- Three.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050608;
      font-family: 'Consolas', 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #00ffcc;
      overflow-x: hidden;
    }

    h2 {
      margin: 12px 0 5px 0;
      color: #00ffcc;
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 22px;
    }

    /* Top Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      background: #0d1117;
      padding: 10px 20px;
      border-radius: 16px;
      margin-bottom: 12px;
      border: 1px solid #00ffcc44;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
      z-index: 10;
      max-width: 900px;
    }

    .mode-btn, .btn {
      padding: 8px 16px;
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.25s ease;
      background: #161b22;
      color: #00ffcc;
      font-size: 13px;
    }

    .mode-btn:hover, .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px #00ffccaa;
      background: #00ffcc;
      color: #000;
    }

    .active-mode {
      background: #00ffcc !important;
      color: #000 !important;
      box-shadow: 0 0 15px #00ffcc;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .color-btn:hover {
      transform: scale(1.2);
    }

    /* Container Box */
    .container {
      position: relative;
      width: 850px;
      height: 520px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 2px solid #00ffcc44;
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.25);
    }

    /* Overlay Displays */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 850px;
      height: 520px;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #output_canvas, #three_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 850px;
      height: 520px;
    }

    #output_canvas {
      transform: scaleX(-1);
      z-index: 4;
    }

    #three_canvas {
      z-index: 2;
      display: none;
    }

    /* HUD Metrics Overlay */
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 5;
      font-size: 11px;
      background: rgba(5, 10, 15, 0.75);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #00ffcc33;
      pointer-events: none;
    }

    .hud-metric {
      margin-bottom: 4px;
    }

    .status-text {
      font-size: 14px;
      color: #00ffcc;
      margin-bottom: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h2>🌌 Cyber Suite: Gesture AI & Spatial FX</h2>
  <div class="status-text" id="gesture-status">Mode: Air Canvas (Index + Thumb Pinch to Draw)</div>

  <div class="controls">
    <button class="mode-btn active-mode" id="btn-canvas" onclick="switchMode('canvas')">🎨 Air Canvas</button>
    <button class="mode-btn" id="btn-brain" onclick="switchMode('brain')">🧠 3D Brain</button>
    <button class="mode-btn" id="btn-shield" onclick="switchMode('shield')">🔮 Magic Shield</button>
    <button class="mode-btn" id="btn-energy" onclick="switchMode('energy')">⚡ Energy Rays</button>
    <button class="mode-btn" id="btn-vortex" onclick="switchMode('vortex')">🌀 Particle Vortex</button>
    <button class="mode-btn" id="btn-matrix" onclick="switchMode('matrix')">🌊 Hologram Matrix</button>

    <div id="canvas-tools" style="display: flex; gap: 8px; align-items: center; margin-left: 10px;">
      <div class="color-btn" style="background: #00ffcc;" onclick="setColor('#00ffcc')"></div>
      <div class="color-btn" style="background: #ff0055;" onclick="setColor('#ff0055')"></div>
      <div class="color-btn" style="background: #ffea00;" onclick="setColor('#ffea00')"></div>
      <div class="color-btn" style="background: #a855f7;" onclick="setColor('#a855f7')"></div>
      
      <button class="btn" onclick="setShape('freehand')">Free</button>
      <button class="btn" onclick="setShape('rectangle')">Rect</button>
      <button class="btn" onclick="setShape('circle')">Circle</button>
      <button class="btn" style="border-color: #ff0055; color: #ff0055;" onclick="clearCanvas()">Clear</button>
    </div>
  </div>

  <div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas" width="850" height="520"></canvas>
    <div id="three_canvas"></div>

    <!-- HUD Telemetry Display -->
    <div class="hud-overlay" id="hud">
      <div class="hud-metric">SYS.STATUS: <span style="color:#00ff00;">ONLINE</span></div>
      <div class="hud-metric">TRACKING: <span id="hud-hand">SEARCHING...</span></div>
      <div class="hud-metric">POS X/Y: <span id="hud-pos">0, 0</span></div>
      <div class="hud-metric">PINCH DIST: <span id="hud-pinch">0px</span></div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const threeContainer = document.getElementById('three_canvas');
    const canvasTools = document.getElementById('canvas-tools');
    const statusText = document.getElementById('gesture-status');

    // HUD Elements
    const hudHand = document.getElementById('hud-hand');
    const hudPos = document.getElementById('hud-pos');
    const hudPinch = document.getElementById('hud-pinch');

    let currentMode = 'canvas'; 

    // --- CANVAS ENGINE STATE ---
    let currentColor = '#00ffcc';
    let currentShape = 'freehand';
    let isDrawing = false;
    let startX = 0, startY = 0;
    let drawingHistory = [];
    let magicRotationAngle = 0;
    let dynamicLineWidth = 4;

    function setColor(color) { currentColor = color; }
    function setShape(shape) { currentShape = shape; }
    function clearCanvas() {
      drawingHistory = [];
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    }

    // Dynamic Mode Switcher
    function switchMode(mode) {
      currentMode = mode;
      
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active-mode'));
      document.getElementById(`btn-${mode}`).classList.add('active-mode');

      if (mode === 'canvas') {
        threeContainer.style.display = 'none';
        videoElement.style.display = 'block';
        canvasTools.style.display = 'flex';
        statusText.innerText = "Mode: Air Canvas (Pinch Index + Thumb to Draw)";
      } else if (mode === 'brain') {
        threeContainer.style.display = 'block';
        videoElement.style.display = 'none';
        canvasTools.style.display = 'none';
        brainGroup.visible = true;
        vortexParticles.visible = false;
        matrixGrid.visible = false;
        statusText.innerText = "Mode: 3D Quantum Brain (Open Hand = Rotate | Fist = Shrink)";
      } else if (mode === 'shield') {
        threeContainer.style.display = 'none';
        videoElement.style.display = 'block';
        canvasTools.style.display = 'none';
        statusText.innerText = "Mode: Doctor Strange Magic Shield (Palm Active)";
      } else if (mode === 'energy') {
        threeContainer.style.display = 'none';
        videoElement.style.display = 'block';
        canvasTools.style.display = 'none';
        statusText.innerText = "Mode: Cyberpunk Energy Rays (Open Hand Burst | Fist Charge)";
      } else if (mode === 'vortex') {
        threeContainer.style.display = 'block';
        videoElement.style.display = 'block';
        canvasTools.style.display = 'none';
        brainGroup.visible = false;
        vortexParticles.visible = true;
        matrixGrid.visible = false;
        statusText.innerText = "Mode: Particle Vortex Attractor (Move Hand to Control Gravity)";
      } else if (mode === 'matrix') {
        threeContainer.style.display = 'block';
        videoElement.style.display = 'block';
        canvasTools.style.display = 'none';
        brainGroup.visible = false;
        vortexParticles.visible = false;
        matrixGrid.visible = true;
        statusText.innerText = "Mode: 3D Holographic Wave Matrix (Move Hand to Disturb Field)";
      }
    }

    // --- THREE.JS GRAPHICS ENGINE ---
    let scene, camera3D, renderer;
    let brainGroup, vortexParticles, matrixGrid;
    let targetScale = 1.0, currentScale = 1.0;
    let targetRotX = 0, targetRotY = 0;
    let vortexAttractor = { x: 0, y: 0 };

    function initThreeEngine() {
      scene = new THREE.Scene();
      camera3D = new THREE.PerspectiveCamera(60, 850 / 520, 0.1, 1000);
      camera3D.position.z = 200;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(850, 520);
      threeContainer.appendChild(renderer.domElement);

      // --- 1. 3D BRAIN MESH ---
      brainGroup = new THREE.Group();
      scene.add(brainGroup);

      const brainParticleCount = 3000;
      const brainGeo = new THREE.BufferGeometry();
      const brainPos = new Float32Array(brainParticleCount * 3);

      for (let i = 0; i < brainParticleCount; i++) {
        let u = Math.random() * Math.PI * 2;
        let v = Math.random() * Math.PI;

        let x = 85 * Math.sin(v) * Math.cos(u);
        let y = 65 * Math.sin(v) * Math.sin(u);
        let z = 55 * Math.cos(v);

        if (x > 0) x += 8; else x -= 8;

        brainPos[i * 3] = x;
        brainPos[i * 3 + 1] = y;
        brainPos[i * 3 + 2] = z;
      }

      brainGeo.setAttribute('position', new THREE.BufferAttribute(brainPos, 3));
      const brainMat = new THREE.PointsMaterial({
        color: 0x00ffcc,
        size: 2.2,
        transparent: true,
        opacity: 0.9
      });
      brainGroup.add(new THREE.Points(brainGeo, brainMat));

      // --- 2. PARTICLE VORTEX SYSTEM ---
      const vortexCount = 4000;
      const vortexGeo = new THREE.BufferGeometry();
      const vortexPos = new Float32Array(vortexCount * 3);
      const vortexVel = new Float32Array(vortexCount * 3);

      for (let i = 0; i < vortexCount * 3; i += 3) {
        vortexPos[i] = (Math.random() - 0.5) * 300;
        vortexPos[i + 1] = (Math.random() - 0.5) * 300;
        vortexPos[i + 2] = (Math.random() - 0.5) * 100;

        vortexVel[i] = 0;
        vortexVel[i + 1] = 0;
        vortexVel[i + 2] = 0;
      }

      vortexGeo.setAttribute('position', new THREE.BufferAttribute(vortexPos, 3));
      const vortexMat = new THREE.PointsMaterial({
        color: 0xff0055,
        size: 2.0,
        transparent: true,
        opacity: 0.8
      });
      vortexParticles = new THREE.Points(vortexGeo, vortexMat);
      vortexParticles.visible = false;
      scene.add(vortexParticles);

      // --- 3. HOLOGRAPHIC WAVE MATRIX ---
      const matrixCols = 40, matrixRows = 30;
      const matrixGeo = new THREE.BufferGeometry();
      const matrixPos = new Float32Array(matrixCols * matrixRows * 3);

      for (let i = 0; i < matrixCols; i++) {
        for (let j = 0; j < matrixRows; j++) {
          let idx = (i * matrixRows + j) * 3;
          matrixPos[idx] = (i - matrixCols / 2) * 8;
          matrixPos[idx + 1] = (j - matrixRows / 2) * 8;
          matrixPos[idx + 2] = 0;
        }
      }

      matrixGeo.setAttribute('position', new THREE.BufferAttribute(matrixPos, 3));
      const matrixMat = new THREE.PointsMaterial({
        color: 0xa855f7,
        size: 3.0,
        transparent: true,
        opacity: 0.85
      });
      matrixGrid = new THREE.Points(matrixGeo, matrixMat);
      matrixGrid.visible = false;
      scene.add(matrixGrid);

      // Animation Loop
      function animateThree() {
        requestAnimationFrame(animateThree);

        // Brain Motion
        if (currentMode === 'brain') {
          currentScale += (targetScale - currentScale) * 0.1;
          brainGroup.scale.set(currentScale, currentScale, currentScale);
          brainGroup.rotation.y += (targetRotY - brainGroup.rotation.y) * 0.1 + 0.003;
          brainGroup.rotation.x += (targetRotX - brainGroup.rotation.x) * 0.1;
        }

        // Particle Vortex Physics Simulation
        if (currentMode === 'vortex' && vortexParticles.visible) {
          const positions = vortexParticles.geometry.attributes.position.array;
          for (let i = 0; i < vortexCount * 3; i += 3) {
            let dx = vortexAttractor.x - positions[i];
            let dy = vortexAttractor.y - positions[i + 1];
            let dist = Math.sqrt(dx * dx + dy * dy) + 10;

            vortexVel[i] += (dx / dist) * 0.35;
            vortexVel[i + 1] += (dy / dist) * 0.35;

            positions[i] += vortexVel[i];
            positions[i + 1] += vortexVel[i + 1];

            vortexVel[i] *= 0.94; // Drag
            vortexVel[i + 1] *= 0.94;
          }
          vortexParticles.geometry.attributes.position.needsUpdate = true;
        }

        // Hologram Wave Matrix Ripples
        if (currentMode === 'matrix' && matrixGrid.visible) {
          const positions = matrixGrid.geometry.attributes.position.array;
          let time = Date.now() * 0.003;
          for (let i = 0; i < matrixCols; i++) {
            for (let j = 0; j < matrixRows; j++) {
              let idx = (i * matrixRows + j) * 3;
              positions[idx + 2] = Math.sin(i * 0.3 + time) * 12 + Math.cos(j * 0.3 + time) * 12;
            }
          }
          matrixGrid.geometry.attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera3D);
      }
      animateThree();
    }

    initThreeEngine();

    // --- MEDIAPIPE PIPELINE ---
    let handLandmarksData = null;
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handLandmarksData = results.multiHandLandmarks[0];
        hudHand.innerText = "LOCKED";
        hudHand.style.color = "#00ff00";
      } else {
        handLandmarksData = null;
        hudHand.innerText = "SEARCHING...";
        hudHand.style.color = "#ff0055";
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
        processAndRenderFrame();
      },
      width: 640,
      height: 480
    });
    camera.start();

    // --- MAIN RENDER & GESTURE PIPELINE ---
    function processAndRenderFrame() {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (currentMode === 'canvas') {
        drawHistory();
      }

      if (handLandmarksData) {
        const landmarks = handLandmarksData;

        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];
        const wrist = landmarks[0];

        const x = (1 - indexTip.x) * canvasElement.width;
        const y = indexTip.y * canvasElement.height;

        const thumbX = (1 - thumbTip.x) * canvasElement.width;
        const thumbY = thumbTip.y * canvasElement.height;

        const pinchDist = Math.hypot(x - thumbX, y - thumbY);
        const wristX = (1 - wrist.x) * canvasElement.width;
        const wristY = wrist.y * canvasElement.height;
        const handClosedDist = Math.hypot(x - wristX, y - wristY);

        // Update HUD Telemetry
        hudPos.innerText = `${Math.round(x)}, ${Math.round(y)}`;
        hudPinch.innerText = `${Math.round(pinchDist)}px`;

        // Update Attractor position for 3D physics
        vortexAttractor.x = (x - canvasElement.width / 2) * 0.35;
        vortexAttractor.y = -(y - canvasElement.height / 2) * 0.35;

        // 1. AIR CANVAS MODE
        if (currentMode === 'canvas') {
          dynamicLineWidth = Math.max(2, Math.min(18, pinchDist / 3));
          drawPointer(x, y, currentColor);

          if (pinchDist < 40) {
            if (!isDrawing) {
              isDrawing = true;
              startX = x;
              startY = y;
            }

            if (currentShape === 'freehand') {
              drawingHistory.push({ type: 'line', x1: startX, y1: startY, x2: x, y2: y, color: currentColor, width: dynamicLineWidth });
              startX = x;
              startY = y;
            } else if (currentShape === 'rectangle') {
              canvasCtx.strokeStyle = currentColor;
              canvasCtx.lineWidth = dynamicLineWidth;
              canvasCtx.strokeRect(startX, startY, x - startX, y - startY);
            } else if (currentShape === 'circle') {
              const radius = Math.hypot(x - startX, y - startY);
              canvasCtx.beginPath();
              canvasCtx.arc(startX, startY, radius, 0, 2 * Math.PI);
              canvasCtx.strokeStyle = currentColor;
              canvasCtx.lineWidth = dynamicLineWidth;
              canvasCtx.stroke();
            }
          } else {
            if (isDrawing) {
              if (currentShape === 'rectangle') {
                drawingHistory.push({ type: 'rectangle', x: startX, y: startY, w: x - startX, h: y - startY, color: currentColor, width: dynamicLineWidth });
              } else if (currentShape === 'circle') {
                const radius = Math.hypot(x - startX, y - startY);
                drawingHistory.push({ type: 'circle', x: startX, y: startY, r: radius, color: currentColor, width: dynamicLineWidth });
              }
              isDrawing = false;
            }
          }
        } 
        
        // 2. 3D BRAIN MODE
        else if (currentMode === 'brain') {
          drawPointer(x, y, '#00ffcc');
          if (handClosedDist < 130) {
            targetScale = 0.5;
            statusText.innerText = "3D Brain: Fist Closed (Shrinking)";
          } else {
            let scaleVal = 1 + ((520 - y) / 250);
            targetScale = Math.max(0.8, Math.min(scaleVal, 2.2));
            statusText.innerText = "3D Brain: Open Hand (Rotating & Expanding)";
          }

          targetRotY = (x / canvasElement.width - 0.5) * Math.PI * 2;
          targetRotX = (y / canvasElement.height - 0.5) * Math.PI;
        }

        // 3. MAGIC SHIELD MODE
        else if (currentMode === 'shield') {
          const palmCenterX = (1 - landmarks[9].x) * canvasElement.width;
          const palmCenterY = landmarks[9].y * canvasElement.height;
          drawMagicShield(palmCenterX, palmCenterY);
        }

        // 4. CYBERPUNK ENERGY MODE
        else if (currentMode === 'energy') {
          drawEnergyRays(landmarks, handClosedDist < 130);
        }

      } else {
        isDrawing = false;
      }
    }

    // --- RENDER HELPERS ---
    function drawPointer(x, y, color) {
      canvasCtx.save();
      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 14, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = 3;
      canvasCtx.shadowColor = color;
      canvasCtx.shadowBlur = 12;
      canvasCtx.stroke();

      canvasCtx.beginPath();
      canvasCtx.arc(x, y, 5, 0, 2 * Math.PI);
      canvasCtx.fillStyle = '#ffffff';
      canvasCtx.fill();
      canvasCtx.restore();
    }

    function drawMagicShield(cx, cy) {
      canvasCtx.save();
      magicRotationAngle += 0.035;

      canvasCtx.translate(cx, cy);

      canvasCtx.beginPath();
      canvasCtx.arc(0, 0, 90, 0, 2 * Math.PI);
      canvasCtx.strokeStyle = "#ff9900";
      canvasCtx.lineWidth = 4;
      canvasCtx.shadowColor = "#ffaa00";
      canvasCtx.shadowBlur = 22;
      canvasCtx.stroke();

      canvasCtx.save();
      canvasCtx.rotate(magicRotationAngle);
      canvasCtx.strokeStyle = "#ffcc00";
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeRect(-65, -65, 130, 130);
      canvasCtx.restore();

      canvasCtx.save();
      canvasCtx.rotate(-magicRotationAngle * 1.5);
      canvasCtx.strokeStyle = "#ff3300";
      canvasCtx.lineWidth = 2;
      canvasCtx.strokeRect(-52, -52, 104, 104);
      canvasCtx.restore();

      canvasCtx.restore();
    }

    function drawEnergyRays(landmarks, isCharging) {
      canvasCtx.save();
      const fingerTips = [4, 8, 12, 16, 20];
      const wristX = (1 - landmarks[0].x) * canvasElement.width;
      const wristY = landmarks[0].y * canvasElement.height;

      const energyColor = isCharging ? "#ff0055" : "#00ffcc";

      fingerTips.forEach((tipIdx) => {
        const tipX = (1 - landmarks[tipIdx].x) * canvasElement.width;
        const tipY = landmarks[tipIdx].y * canvasElement.height;

        canvasCtx.beginPath();
        canvasCtx.moveTo(wristX, wristY);
        canvasCtx.lineTo(tipX, tipY);
        canvasCtx.strokeStyle = energyColor;
        canvasCtx.lineWidth = isCharging ? 7 : 3;
        canvasCtx.shadowColor = energyColor;
        canvasCtx.shadowBlur = 18;
        canvasCtx.stroke();
      });

      canvasCtx.restore();
    }

    function drawHistory() {
      drawingHistory.forEach(item => {
        canvasCtx.strokeStyle = item.color;
        canvasCtx.lineWidth = item.width || 4;

        if (item.type === 'line') {
          canvasCtx.beginPath();
          canvasCtx.moveTo(item.x1, item.y1);
          canvasCtx.lineTo(item.x2, item.y2);
          canvasCtx.stroke();
        } else if (item.type === 'rectangle') {
          canvasCtx.strokeRect(item.x, item.y, item.w, item.h);
        } else if (item.type === 'circle') {
          canvasCtx.beginPath();
          canvasCtx.arc(item.x, item.y, item.r, 0, 2 * Math.PI);
          canvasCtx.stroke();
        }
      });
    }
  </script>
</body>
</html>
